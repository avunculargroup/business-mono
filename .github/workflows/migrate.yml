name: Database Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      # A change to this workflow must run this workflow. Without it, a fix to
      # the migration process merges green and never executes — which is exactly
      # how the --include-all fix sat on main doing nothing.
      - '.github/workflows/migrate.yml'
  # Run on demand. Needed whenever the ledger and the schema drift apart with no
  # migration file to push (a repair, a manual apply, or a fix like the one
  # above that has already merged), since there is otherwise no way to make this
  # run without inventing a migration to trigger it.
  workflow_dispatch:

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the regenerated types file back to main

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID --password $SUPABASE_DB_PASSWORD
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Repair remote-only migration versions
        run: |
          # Find any remote versions that have no local file and mark them reverted.
          # This handles stale entries from renamed/removed migration files so that
          # supabase db push does not abort with "Remote migration versions not found".
          MIGRATION_OUTPUT=$(supabase migration list 2>&1) || true
          ALL_VERSIONS=$(echo "$MIGRATION_OUTPUT" | grep -oE '[0-9]{14}' | sort -u)
          for version in $ALL_VERSIONS; do
            if ! ls supabase/migrations/${version}_*.sql >/dev/null 2>&1; then
              echo "Repairing remote-only version: $version"
              supabase migration repair --status reverted "$version" 2>&1 || true
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply migrations
        # --include-all applies local migrations whose timestamp sorts BEFORE the
        # last one already on remote. Without it, `db push` aborts the whole run
        # the moment two branches merge out of timestamp order — which is the
        # normal case here, since a migration is dated when it is written, not
        # when its PR lands. That abort is silent from the app's point of view:
        # the merge succeeds, the deploy succeeds, and the schema simply never
        # changes.
        #
        # This is not a licence to apply anything: every migration in this repo
        # is written idempotently (IF NOT EXISTS / CREATE OR REPLACE /
        # DROP ... IF EXISTS / ON CONFLICT DO NOTHING), so re-running or
        # late-running one is a no-op rather than a rewrite.
        run: supabase db push --include-all --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Regenerate TypeScript types
        run: |
          supabase gen types typescript \
            --project-id $SUPABASE_PROJECT_ID \
            --schema public \
            > packages/db/src/types/database.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Commit updated types
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/types/database.ts
          if git diff --cached --quiet; then
            echo "Types unchanged — nothing to commit"
          else
            git commit -m "chore: regenerate Supabase types [skip ci]"
            git push
          fi
